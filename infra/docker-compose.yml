name: rio-gps

# Bounded container logs for every service: without this Docker's json-file
# driver grows without limit and can eventually fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Two databases are provisioned by init script below: rio and traccar.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
    env_file:
      - ../.env # init-databases.sh reads RIO_DB_PASSWORD / TRACCAR_DB_PASSWORD from here
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      # Bound to loopback only — Postgres must never be reachable from the
      # public internet (see docs/DEPLOYMENT.md). Host port is configurable
      # because some dev machines already run a native Postgres on 5432
      # (set POSTGRES_HOST_PORT=55432 in that case); a fresh VPS should use
      # the default.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Loopback only — Redis must never be reachable from the public internet.
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  traccar:
    image: traccar/traccar:6.15.3-ubuntu
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    # Traccar's documented "any config key can be overridden by an env var"
    # mechanism does NOT actually work for database.password/forward.header —
    # verified empirically (Hikari logs "no password was provided" even with
    # DATABASE_PASSWORD set). entrypoint.sh substitutes the real secrets into
    # traccar.xml.template at container startup instead.
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    healthcheck:
      # Both the device listener and the admin/API port must accept connections.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5027 && exec 4<>/dev/tcp/127.0.0.1/8082"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    env_file:
      - ../.env # entrypoint.sh reads TRACCAR_DB_PASSWORD / TRACCAR_WEBHOOK_SECRET from here
    volumes:
      - ./traccar/traccar.xml.template:/opt/traccar/conf/traccar.xml.template:ro
      - ./traccar/entrypoint.sh:/docker-entrypoint.sh:ro
      - traccar-logs:/opt/traccar/logs
    ports:
      # Admin UI/REST API: loopback only — reach it via SSH tunnel, not
      # directly from the internet (RIO reaches it over the internal docker
      # network at http://traccar:8082 regardless of this mapping).
      - "127.0.0.1:8082:8082"
      # Teltonika device port: MUST be reachable from the public internet —
      # this is the one port a real FMM230 actually connects to. Do not put
      # a generic HTTP(S) reverse proxy or Cloudflare's proxy in front of it.
      - "5027:5027"

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      # .env's RIO_DATABASE_URL/REDIS_URL/TRACCAR_API_URL point at localhost
      # for host-run tooling (pnpm dev:web, migrations); inside the compose
      # network the container must reach these by service name instead.
      RIO_DATABASE_URL: postgres://rio:${RIO_DB_PASSWORD:?set in .env}@postgres:5432/rio
      REDIS_URL: redis://redis:6379
      TRACCAR_API_URL: http://traccar:8082
    ports:
      # Loopback only — the reverse-proxy service is the public entry point
      # (see reverse-proxy below); this mapping exists for host-side debugging.
      - "127.0.0.1:3000:3000"
    healthcheck:
      # Liveness only (no DB/Redis dependency) so a dependency blip doesn't restart web.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      RIO_DATABASE_URL: postgres://rio:${RIO_DB_PASSWORD:?set in .env}@postgres:5432/rio
      REDIS_URL: redis://redis:6379
      TRACCAR_API_URL: http://traccar:8082
    # No `ports:` — the worker has no HTTP surface and must not be reachable
    # from outside the compose network at all.

  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    env_file:
      - ../.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      # The only two ports on this host that should be reachable from the
      # public internet besides Traccar's 5027.
      - "80:80"
      - "443:443"

volumes:
  postgres-data:
  traccar-logs:
  caddy-data:
  caddy-config:
